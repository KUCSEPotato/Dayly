[project]
name = "dayly-api"
version = "0.2.1"
description = "A small, layered FastAPI personal todo application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
